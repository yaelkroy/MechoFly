name: Repair PowerShell title validation

on:
  push:
    branches:
      - feat/original-video-parity-rust-v5
    paths:
      - .github/workflows/repair-ps51-title-validation.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Make title validation PowerShell 5.1 safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/Test-Windows-GuiStartup.ps1')
          text = path.read_text(encoding='utf-8')
          start_marker = (
              '        $ExpectedSkinTitlePassed = '
              '@($NeuralWindows | Where-Object {\n'
          )
          end_marker = (
              '        $UniqueNeuralFrames = '
              '@($NeuralFrames | Sort-Object -Unique)\n'
          )
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Neural-title validation markers are not unique.')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '\n'.join([
              '        $NeuralWindowTitles = @($NeuralWindows | ForEach-Object {',
              '            [string]$_.title',
              '        })',
              '        $ExpectedSkinTitlePassed = @($NeuralWindowTitles | Where-Object {',
              '            -not $_.StartsWith(',
              "                $ExpectedSkinLabel + ' ',",
              '                [System.StringComparison]::Ordinal)',
              '        }).Count -eq 0',
              '        if (-not $ExpectedSkinTitlePassed) {',
              "            throw ('A neural window title does not match skin ' +",
              "                $ExpectedSkinLabel + '; actual=' +",
              "                ($NeuralWindowTitles -join ' | '))",
              '        }',
              '        $NeuralFrames = @($NeuralWindowTitles | ForEach-Object {',
              '            $Match = [regex]::Match(',
              '                $_,',
              "                'frame (?<frame>[0-9]{8})$')",
              '            if (-not $Match.Success) {',
              "                throw ('Neural evidence title has no frozen frame: ' +",
              '                    [string]$_)',
              '            }',
              "            [uint64]$Match.Groups['frame'].Value",
              '        })',
              '',
          ])
          updated = text[:start] + replacement + text[end:]
          non_ascii = sorted({character for character in updated if ord(character) > 127})
          if non_ascii:
              rendered = ', '.join(f'U+{ord(character):04X}' for character in non_ascii)
              raise SystemExit(f'PowerShell verifier still contains non-ASCII literals: {rendered}')
          path.write_text(updated, encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Publish verifier repair
        shell: bash
        run: |
          git config user.name "Yael Demedetskaya"
          git config user.email "31790191+yaelkroy@users.noreply.github.com"
          git add tools/Test-Windows-GuiStartup.ps1
          git commit -m "Make neural title checks PowerShell 5.1 safe"
          git push origin HEAD:feat/original-video-parity-rust-v5

name: MechoFly N4.1-C natural-flight candidate

on:
  push:
    branches: ["feat/n4-1-c-natural-flight-rust-v20"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n4-1-c-natural-flight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: mechofly-n41-flight-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mechofly-n41-flight-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            mechofly-n41-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Static boundaries and frozen identities
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed.' }
          python tools/verify_n41_integration.py --root . --receipt artifacts/n41-runtime-isolation.json
          if ($LASTEXITCODE -ne 0) { throw 'N4.1 runtime isolation failed.' }
          python tools/verify_n41_natural_motion.py --root . --receipt artifacts/n41-natural-motion.json
          if ($LASTEXITCODE -ne 0) { throw 'Accepted natural-motion boundary failed.' }
          python tools/verify_n41_natural_flight.py --root . --receipt artifacts/n41-natural-flight.json
          if ($LASTEXITCODE -ne 0) { throw 'Natural-flight boundary failed.' }
          python tools/verify_n41_visual_review.py --root . --receipt artifacts/n41-visual-review.json
          if ($LASTEXITCODE -ne 0) { throw 'Visual-review boundary failed.' }
          ./tools/Test-N41VisualReviewMetrics.ps1 -OutputDirectory artifacts/n41-metrics-regression
          if ($LASTEXITCODE -ne 0) { throw 'Visual metrics regression failed.' }
      - name: Rust tests and warnings
        shell: pwsh
        run: |
          cargo test --release --locked --workspace --all-targets --features mechofly-app/n41-visual-review-b -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed.' }
          cargo clippy --release --locked --workspace --all-targets --features mechofly-app/n41-visual-review-b -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
      - name: Exact deterministic profile probes
        shell: pwsh
        run: |
          cargo run -p mechofly-core --example n41_live_profile --release --locked -- --profile n41-b-natural-flight --tier extended-65536 --seconds 600 --output artifacts/n41-live-a.json
          if ($LASTEXITCODE -ne 0) { throw 'First exact live probe failed.' }
          cargo run -p mechofly-core --example n41_live_profile --release --locked -- --profile n41-b-natural-flight --tier extended-65536 --seconds 600 --output artifacts/n41-live-b.json
          if ($LASTEXITCODE -ne 0) { throw 'Second exact live probe failed.' }
          $a = Get-Content artifacts/n41-live-a.json -Raw | ConvertFrom-Json
          $b = Get-Content artifacts/n41-live-b.json -Raw | ConvertFrom-Json
          if ($a.deterministic_signature_sha256 -cne $b.deterministic_signature_sha256) { throw 'Exact live probes diverged.' }
          $airborne = @($a.occupancy_frames.PSObject.Properties.Name | Where-Object {
            $_ -in @('PreEscape', 'Flight', 'Landing')
          })
          if ($airborne.Count -ne 0) { throw 'Natural-flight profile added zero-input escape.' }
      - name: Canonical rejection and candidate build
        shell: pwsh
        run: |
          $env:MECHOFLY_DATA_DIR = (Join-Path $PWD 'artifacts\canonical-app-data')
          cargo build --release --locked -p mechofly-app
          if ($LASTEXITCODE -ne 0) { throw 'Canonical build failed.' }
          $canonical = (Resolve-Path 'target\release\MechoFly.exe').Path
          $canonicalReceipt = (Join-Path $PWD 'artifacts\canonical-self-test.json')
          $process = Start-Process -FilePath $canonical -ArgumentList @('--self-test', ('"' + $canonicalReceipt + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Canonical self-test failed.' }
          $rejectReceipt = (Join-Path $PWD 'artifacts\canonical-must-reject-review.json')
          $process = Start-Process -FilePath $canonical -ArgumentList @('--n41-b-visual-review', '--n41-visual-review-receipt', ('"' + $rejectReceipt + '"')) -Wait -PassThru
          if ($process.ExitCode -eq 0 -or (Test-Path -LiteralPath $rejectReceipt)) { throw 'Canonical binary accepted review mode.' }

          $candidateTarget = (Join-Path $PWD 'artifacts\candidate-target')
          cargo build --release --locked -p mechofly-app --features n41-visual-review-b --target-dir $candidateTarget
          if ($LASTEXITCODE -ne 0) { throw 'Feature-gated candidate build failed.' }
          $candidate = (Resolve-Path (Join-Path $candidateTarget 'release\MechoFly.exe')).Path
          $candidateReceipt = (Join-Path $PWD 'artifacts\candidate-self-test.json')
          $process = Start-Process -FilePath $candidate -ArgumentList @('--self-test', ('"' + $candidateReceipt + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Candidate self-test failed.' }
          [ordered]@{
            schema_version = 1
            status = 'PASS'
            canonical_executable_sha256 = (Get-FileHash $canonical -Algorithm SHA256).Hash.ToLowerInvariant()
            candidate_executable_sha256 = (Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            canonical_default_profile = 'n4'
            candidate_review_profile = 'n41-b-natural-flight'
            candidate_requires_feature = 'n41-visual-review-b'
            candidate_requires_flag = '--n41-b-visual-review'
            live_gui_review_run_in_ci = $false
            promotion_authorized = $false
            deployment_authorized = $false
          } | ConvertTo-Json | Set-Content -LiteralPath artifacts\candidate-build-receipt.json -Encoding utf8
      - name: Final source immutability
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting drifted.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Validation mutated tracked source.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mechofly-n41-c-natural-flight-candidate
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

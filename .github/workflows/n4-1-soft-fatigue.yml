name: MechoFly N4.1 soft-fatigue experiment

on:
  push:
    branches: ["feat/n4-1-soft-fatigue-experiment-rust-v15"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n4-1-soft-fatigue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-experiment:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: mechofly-n41-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mechofly-n41-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            mechofly-n4-integrated-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            mechofly-windows-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Source and invariant gates
        shell: powershell
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed.' }
          python tools/verify_n41_integration.py `
            --root . `
            --receipt artifacts/n41-runtime-isolation.json
          if ($LASTEXITCODE -ne 0) { throw 'N4.1 runtime isolation failed.' }
          cargo test --release --locked -p mechofly-core --test n4_dynamics -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Frozen N4 controller tests failed.' }
          cargo test --release --locked -p mechofly-core --test n41_soft_fatigue -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'N4.1 tests failed.' }
          cargo clippy --release --locked -p mechofly-core --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Warnings-denied Clippy failed.' }
      - name: Full host and frozen N4 semantic parity
        shell: powershell
        run: |
          cargo build --release --locked -p mechofly-app
          if ($LASTEXITCODE -ne 0) { throw 'Windows host build failed.' }
          python tools/run_n4_native_checks.py
          if ($LASTEXITCODE -ne 0) { throw 'Native N4 smoke failed.' }
          python tools/verify_n4_frozen_signatures.py `
            --campaign-dir artifacts/n4-campaign `
            --receipt artifacts/n4-frozen-semantic-parity.json
          if ($LASTEXITCODE -ne 0) { throw 'Frozen N4 signatures changed.' }
      - name: Process-isolated matched matrix
        shell: powershell
        run: |
          cargo build --release --locked -p mechofly-core --example n41_experiment
          if ($LASTEXITCODE -ne 0) { throw 'Experiment build failed.' }
          python tools/run_n41_matrix.py `
            --exe target/release/examples/n41_experiment.exe `
            --output-dir artifacts/n41-matrix `
            --seeds 1 `
            --repeats 2 `
            --seconds 600
          if ($LASTEXITCODE -ne 0) { throw 'Matched matrix failed.' }
          python tools/evaluate_n41_matrix.py `
            --matrix-dir artifacts/n41-matrix `
            --output-json artifacts/n41-evaluation.json `
            --output-markdown artifacts/n41-evaluation.md
          if ($LASTEXITCODE -ne 0) { throw 'Matrix evaluation failed.' }
      - name: Final source immutability
        shell: powershell
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting drifted.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Validation mutated tracked source.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mechofly-n41-offline-experiment
          path: |
            artifacts/n4-self-test.json
            artifacts/n4-native-verification.json
            artifacts/n4-frozen-semantic-parity.json
            artifacts/n41-runtime-isolation.json
            artifacts/n41-matrix
            artifacts/n41-evaluation.json
            artifacts/n41-evaluation.md
          if-no-files-found: error
          retention-days: 14

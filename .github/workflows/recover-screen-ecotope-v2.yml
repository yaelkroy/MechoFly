name: Recover Screen Ecotope implementation v2

on:
  push:
    branches:
      - feat/screen-ecotope-work-mode-v1
    paths:
      - .github/workflows/recover-screen-ecotope-v2.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-screen-ecotope-v1.yml').read_text(encoding='utf-8')
          opening = "          python3 - <<'PY'\n"
          start = source.index(opening) + len(opening)
          end = source.index("\n          PY\n", start)
          payload = source[start:end]
          prefix = '          '
          reconstructed = []
          inside_triple = False
          for line_number, raw_line in enumerate(payload.splitlines(), start=1):
              line = raw_line
              if not inside_triple and line:
                  if not line.startswith(prefix):
                      raise SystemExit(
                          f'embedded implementation line {line_number} lacks YAML indentation'
                      )
                  line = line[len(prefix):]
              if line.count("'''") % 2 == 1:
                  inside_triple = not inside_triple
              reconstructed.append(line)
          if inside_triple:
              raise SystemExit('embedded implementation ended inside a triple-quoted string')
          Path('/tmp/apply-screen-ecotope-v1.py').write_text(
              '\n'.join(reconstructed) + '\n',
              encoding='utf-8',
          )
          PY
          python3 /tmp/apply-screen-ecotope-v1.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          ecotope_path = Path('crates/mechofly-app/src/screen_ecotope.rs')
          replace_once(
              ecotope_path,
              "}\n        }\n    }\n}\n\n#[derive(Clone, Debug, Eq, PartialEq)]\npub struct BeliefMap",
              "}\n\n#[derive(Clone, Debug, Eq, PartialEq)]\npub struct BeliefMap",
              'duplicated BeliefCell boundary',
          )
          replace_once(
              ecotope_path,
              "        self.motivation.arousal_q15 = threat_q15;\n\n        let source_position",
              "        self.motivation.arousal_q15 = threat_q15;\n        if input.recent_interaction {\n            self.motivation.arousal_q15 = self.motivation.arousal_q15.max(4_000);\n        }\n\n        let source_position",
              'recent interaction arousal',
          )

          pet_path = Path('crates/mechofly-app/src/pet.rs')
          old_motion = '\n'.join([
              '    let flight_start = airborne.screen_position;',
              '    let mut flight_path_pixels = 0.0;',
              '    for _ in 0..240 {',
              '        let before = airborne.screen_position;',
              '        airborne.advance(1.0 / 60.0, Behavior::Flight, origin, screen, false, None);',
              '        flight_path_pixels += airborne.screen_position.distance(before);',
              '    }',
              '    let flight_horizontal_pixels = (airborne.screen_position.x - flight_start.x).abs();',
              '    let flight_vertical_pixels = (airborne.screen_position.y - flight_start.y).abs();',
              '',
          ])
          new_motion = '\n'.join([
              '    let flight_start = airborne.screen_position;',
              '    let mut flight_path_pixels = 0.0;',
              '    let mut flight_min_x = flight_start.x;',
              '    let mut flight_max_x = flight_start.x;',
              '    let mut flight_min_y = flight_start.y;',
              '    let mut flight_max_y = flight_start.y;',
              '    for _ in 0..240 {',
              '        let before = airborne.screen_position;',
              '        airborne.advance(1.0 / 60.0, Behavior::Flight, origin, screen, false, None);',
              '        flight_path_pixels += airborne.screen_position.distance(before);',
              '        flight_min_x = flight_min_x.min(airborne.screen_position.x);',
              '        flight_max_x = flight_max_x.max(airborne.screen_position.x);',
              '        flight_min_y = flight_min_y.min(airborne.screen_position.y);',
              '        flight_max_y = flight_max_y.max(airborne.screen_position.y);',
              '    }',
              '    let flight_horizontal_pixels = flight_max_x - flight_min_x;',
              '    let flight_vertical_pixels = flight_max_y - flight_min_y;',
              '',
          ])
          replace_once(pet_path, old_motion, new_motion, 'flight coverage measurement')

          runtime_path = Path('crates/mechofly-app/src/runtime.rs')
          replace_once(
              runtime_path,
              '    pub fn stimulate_action(&mut self, action: Action) -> bool {\n',
              '    #[allow(dead_code)]\n    pub fn stimulate_action(&mut self, action: Action) -> bool {\n',
              'stimulate_action annotation',
          )
          PY
          cargo fmt --all
          cargo test --workspace --locked
          git diff --check
      - name: Publish implementation candidate
        shell: bash
        run: |
          git config user.name "Yael Demedetskaya"
          git config user.email "31790191+yaelkroy@users.noreply.github.com"
          git rm -r tools/.screen-ecotope-patch
          git add \
            crates/mechofly-app/src/app.rs \
            crates/mechofly-app/src/brain_lab.rs \
            crates/mechofly-app/src/desktop_pet.rs \
            crates/mechofly-app/src/main.rs \
            crates/mechofly-app/src/pet.rs \
            crates/mechofly-app/src/runtime.rs \
            crates/mechofly-app/src/screen_ecotope.rs \
            crates/mechofly-app/src/self_test.rs \
            crates/mechofly-core/src/model.rs
          git commit -m "Implement Screen Ecotope work mode"
          git push origin HEAD:feat/screen-ecotope-work-mode-v1

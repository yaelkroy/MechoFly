name: Repair r2 validation scope

on:
  push:
    branches: ["fix/landing-motion-continuity-rust-v6"]
    paths: [".github/workflows/repair-r2-use-windows-lint.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Keep zero-warning lint on the authoritative Windows job
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-landing-continuity-v6-r2.yml')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = '          cargo clippy --workspace --all-targets --locked -- -D warnings\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one Linux clippy command, found {count}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Publish repaired staging workflow
        shell: bash
        run: |
          git config user.name "Yael Demedetskaya"
          git config user.email "31790191+yaelkroy@users.noreply.github.com"
          git rm .github/workflows/repair-r2-use-windows-lint.yml
          git add .github/workflows/apply-landing-continuity-v6-r2.yml
          git commit -m "Use Windows as zero-warning lint authority"
          git push origin HEAD:fix/landing-motion-continuity-rust-v6

name: Apply Screen Ecotope work-mode implementation

on:
  push:
    branches:
      - feat/screen-ecotope-work-mode-v1
    paths:
      - .github/workflows/apply-screen-ecotope-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Assemble and integrate Screen Ecotope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          root = Path('.')
          chunk_dir = root / 'tools/.screen-ecotope-patch'
          chunks = sorted(chunk_dir.glob('*.b64'))
          if len(chunks) != 8:
              raise SystemExit(f'expected 8 Screen Ecotope chunks, found {len(chunks)}')
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in chunks)
          ecotope = base64.b64decode(encoded).decode('utf-8')
          destination = root / 'crates/mechofly-app/src/screen_ecotope.rs'
          destination.write_text(ecotope, encoding='utf-8', newline='\n')

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))


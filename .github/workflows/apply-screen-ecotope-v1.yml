        seed: 11,
        activation: vec![0; FUNCTIONAL_POPULATION_COUNT * 4],
        spikes: vec![0; FUNCTIONAL_POPULATION_COUNT * 4],
        behavior: Behavior::Rest,
        behavior_age_frames: 0,
    };
    (0..900).all(|frame| {
        state.frame = frame;
        matches!(modeled_behavior(&state, 0), Behavior::Rest | Behavior::Quiet)
    })
}

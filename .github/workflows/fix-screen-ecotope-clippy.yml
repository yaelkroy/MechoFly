name: Fix Screen Ecotope lint boundary

on:
  push:
    branches:
      - feat/screen-ecotope-work-mode-v1
    paths:
      - .github/workflows/fix-screen-ecotope-clippy.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply lint and receipt repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          ecotope = Path('crates/mechofly-app/src/screen_ecotope.rs')
          text = ecotope.read_text(encoding='utf-8')
          replacements = {
              '0xEC07_0FE': '0x0EC0_70FE',
              '0xC105_1A6': '0x0C10_51A6',
              'mix64(self.seed ^ next_bucket ^ 0xC07A_61A7) % 4 == 0':
                  'mix64(self.seed ^ next_bucket ^ 0xC07A_61A7).is_multiple_of(4)',
              'mix64(self.seed ^ dropout_bucket ^ 0xD20F_0F5E) % 13 == 0':
                  'mix64(self.seed ^ dropout_bucket ^ 0xD20F_0F5E).is_multiple_of(13)',
          }
          expected_counts = {
              '0xEC07_0FE': 2,
              '0xC105_1A6': 1,
              'mix64(self.seed ^ next_bucket ^ 0xC07A_61A7) % 4 == 0': 1,
              'mix64(self.seed ^ dropout_bucket ^ 0xD20F_0F5E) % 13 == 0': 1,
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != expected_counts[old]:
                  raise SystemExit(f'{old}: expected {expected_counts[old]} matches, found {count}')
              text = text.replace(old, new)
          ecotope.write_text(text, encoding='utf-8', newline='\n')

          self_test = Path('crates/mechofly-app/src/self_test.rs')
          replace_once(
              self_test,
              '    desktop_pet_topmost_with_neural_windows: bool,\n',
              '    desktop_pet_topmost_without_neural_windows: bool,\n    desktop_pet_topmost_with_neural_windows: bool,\n',
              'self-test topmost field',
          )
          replace_once(
              self_test,
              '''        desktop_pet_topmost_with_neural_windows:
            desktop_safety.topmost_when_observatory_open,
''',
              '''        desktop_pet_topmost_without_neural_windows:
            desktop_safety.topmost_when_observatory_closed,
        desktop_pet_topmost_with_neural_windows:
            desktop_safety.topmost_when_observatory_open,
''',
              'self-test topmost assignment',
          )
          replace_once(
              self_test,
              '''    let desktop_safety = NonWindowsDesktopSafetyContract {
        passed: true,
        topmost_when_observatory_open: true,
''',
              '''    let desktop_safety = NonWindowsDesktopSafetyContract {
        passed: true,
        topmost_when_observatory_closed: true,
        topmost_when_observatory_open: true,
''',
              'non-Windows topmost initialization',
          )
          replace_once(
              self_test,
              '''struct NonWindowsDesktopSafetyContract {
    passed: bool,
    topmost_when_observatory_open: bool,
''',
              '''struct NonWindowsDesktopSafetyContract {
    passed: bool,
    topmost_when_observatory_closed: bool,
    topmost_when_observatory_open: bool,
''',
              'non-Windows topmost contract',
          )
          PY
          cargo fmt --all
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          git diff --check
      - name: Publish lint repair
        shell: bash
        run: |
          git config user.name "Yael Demedetskaya"
          git config user.email "31790191+yaelkroy@users.noreply.github.com"
          git add \
            crates/mechofly-app/src/screen_ecotope.rs \
            crates/mechofly-app/src/self_test.rs
          git commit -m "Repair Screen Ecotope lint and receipt coverage"
          git push origin HEAD:feat/screen-ecotope-work-mode-v1

name: MechoFly N3 intent-separation parity

on:
  push:
    branches: ["feat/behavior-intent-separation-rust-v12"]
  pull_request:
    branches: ["fix/heading-aware-shadow-footprint-rust-v11"]

permissions:
  contents: read

jobs:
  parity:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: mechofly-n3-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mechofly-n3-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            mechofly-windows-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Frozen-selector and framewise parity
        shell: powershell
        run: |
          cargo test --locked --release -p mechofly-core --test n3_parity -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'N3 parity tests failed.' }
      - name: Core tests and unchanged-harness smoke
        shell: powershell
        run: |
          cargo test --locked -p mechofly-core
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          cargo run --locked --release -p mechofly-core --example n3_baseline -- --behavior-baseline artifacts/n3-smoke.json --baseline-seeds 2 --baseline-repeats 2 --baseline-seconds 30
          if ($LASTEXITCODE -ne 0) { throw 'Unchanged harness smoke failed.' }
      - name: Warnings denied
        shell: powershell
        run: |
          cargo clippy --locked -p mechofly-core --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'N3 Clippy gate failed.' }
      - name: Formatting and immutable tracked source
        if: always()
        shell: powershell
        run: |
          cargo fmt --all --check
          $formatExit = $LASTEXITCODE
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tests changed tracked source.' }
          if ($formatExit -ne 0) { throw 'N3 formatting gate failed.' }

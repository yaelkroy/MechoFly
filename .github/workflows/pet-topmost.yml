name: MechoFly desktop-pet z-order verification

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "crates/mechofly-app/src/desktop_pet.rs"
      - "tools/Test-Windows-PetTopmost.ps1"
      - ".github/workflows/pet-topmost.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/mechofly-app/src/desktop_pet.rs"
      - "tools/Test-Windows-PetTopmost.ps1"
      - ".github/workflows/pet-topmost.yml"

permissions:
  contents: read

jobs:
  windows-topmost:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Parse Windows topmost oracle
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\tools\Test-Windows-PetTopmost.ps1).Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if (@($errors).Count -ne 0) {
            $errors | Format-List -Force
            throw 'Topmost oracle PowerShell parser failure.'
          }
      - name: Check Rust formatting
        shell: powershell
        run: cargo fmt --all --check
      - name: Test deterministic Rust workspace
        shell: powershell
        run: cargo test --workspace --locked
      - name: Compile x64 Windows host
        shell: powershell
        run: .\host-windows\build.ps1
      - name: Prove the pet remains above Brain Lab
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\artifacts -Force | Out-Null
          .\tools\Test-Windows-PetTopmost.ps1 `
            -ExecutablePath .\host-windows\bin\MechoFly.exe `
            -ReceiptPath .\artifacts\pet-topmost.json `
            -ObservationSeconds 12
          $receipt = Get-Content .\artifacts\pet-topmost.json -Raw |
            ConvertFrom-Json
          if ($receipt.schema_version -ne 1) { throw 'Topmost receipt schema is stale.' }
          if ($receipt.status -ne 'PASS') { throw 'Topmost receipt failed.' }
          if (-not $receipt.desktop_pet_topmost) { throw 'Pet lost WS_EX_TOPMOST.' }
          if (-not $receipt.desktop_pet_above_brain_lab) { throw 'Pet is below Brain Lab.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mechofly-pet-topmost-verification
          path: |
            artifacts/pet-topmost.json
            host-windows/bin/
          if-no-files-found: warn

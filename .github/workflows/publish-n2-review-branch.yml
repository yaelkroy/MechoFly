name: Publish clean N2 review branch

on:
  push:
    branches: ["feat/behavior-transition-telemetry-rust-v9"]
    paths: [".github/workflows/publish-n2-review-branch.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Copy exact source candidate onto clean review branch
        shell: bash
        run: |
          source_commit="d7ed21af4d8c84f2bb7a686123801e0f742bcfc3"
          target_branch="feat/behavior-transition-telemetry-rust-v9-review"
          expected_parent="90b5d6323931e643ad2e0c31ed16e21648777da9"
          test "$(git rev-parse "$source_commit^{tree}")" = "3b5e0ef6f55765f8d5bd4c79a573e09964b7d0cf"
          git fetch origin "$target_branch:refs/remotes/origin/$target_branch"
          test "$(git rev-parse origin/$target_branch)" = "$expected_parent"
          git switch --detach "origin/$target_branch"
          git checkout "$source_commit" -- \
            crates/mechofly-core/src/behavior_telemetry.rs \
            crates/mechofly-core/src/lib.rs \
            crates/mechofly-core/src/model.rs \
            crates/mechofly-app/src/behavior_baseline.rs \
            crates/mechofly-app/src/main.rs \
            crates/mechofly-app/src/brain_lab.rs \
            crates/mechofly-app/src/self_test.rs \
            tools/Setup-AI100-MechoFly.ps1
          cargo fmt --all --check
          git diff --check
          git config user.name "Yael Demedetskaya"
          git config user.email "31790191+yaelkroy@users.noreply.github.com"
          git add \
            crates/mechofly-core/src/behavior_telemetry.rs \
            crates/mechofly-core/src/lib.rs \
            crates/mechofly-core/src/model.rs \
            crates/mechofly-app/src/behavior_baseline.rs \
            crates/mechofly-app/src/main.rs \
            crates/mechofly-app/src/brain_lab.rs \
            crates/mechofly-app/src/self_test.rs \
            tools/Setup-AI100-MechoFly.ps1
          git commit -m "N2: add observational behavior transition telemetry"
          git push origin "HEAD:$target_branch"

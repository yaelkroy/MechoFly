name: Recover Screen Ecotope work-mode implementation

on:
  push:
    branches:
      - feat/screen-ecotope-work-mode-v1
    paths:
      - .github/workflows/recover-screen-ecotope-v1.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reconstruct and execute the implementation payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-screen-ecotope-v1.yml').read_text(encoding='utf-8')
          opening = "          python3 - <<'PY'\n"
          start = source.index(opening) + len(opening)
          end = source.index("\n          PY\n", start)
          payload = source[start:end]
          prefix = '          '
          reconstructed = []
          inside_triple = False
          for line_number, raw_line in enumerate(payload.splitlines(), start=1):
              line = raw_line
              if not inside_triple and line:
                  if not line.startswith(prefix):
                      raise SystemExit(
                          f'embedded implementation line {line_number} lacks YAML indentation'
                      )
                  line = line[len(prefix):]
              if line.count("'''") % 2 == 1:
                  inside_triple = not inside_triple
              reconstructed.append(line)
          if inside_triple:
              raise SystemExit('embedded implementation ended inside a triple-quoted string')
          output = Path('/tmp/apply-screen-ecotope-v1.py')
          output.write_text('\n'.join(reconstructed) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply-screen-ecotope-v1.py
          python3 - <<'PY'
          from pathlib import Path

          ecotope_path = Path('crates/mechofly-app/src/screen_ecotope.rs')
          ecotope = ecotope_path.read_text(encoding='utf-8')
          old = "}\n        }\n    }\n}\n\n#[derive(Clone, Debug, Eq, PartialEq)]\npub struct BeliefMap"
          new = "}\n\n#[derive(Clone, Debug, Eq, PartialEq)]\npub struct BeliefMap"
          if ecotope.count(old) != 1:
              raise SystemExit(f'expected one duplicated BeliefCell boundary, found {ecotope.count(old)}')
          ecotope = ecotope.replace(old, new, 1)
          old_interaction = "        self.motivation.arousal_q15 = threat_q15;\n\n        let source_position"
          new_interaction = "        self.motivation.arousal_q15 = threat_q15;\n        if input.recent_interaction {\n            self.motivation.arousal_q15 = self.motivation.arousal_q15.max(4_000);\n        }\n\n        let source_position"
          if ecotope.count(old_interaction) != 1:
              raise SystemExit('recent-interaction ecotope marker was not unique')
          ecotope_path.write_text(
              ecotope.replace(old_interaction, new_interaction, 1),
              encoding='utf-8',
              newline='\n',
          )

          pet_path = Path('crates/mechofly-app/src/pet.rs')
          pet = pet_path.read_text(encoding='utf-8')
          old_motion = """    let flight_start = airborne.screen_position;
    let mut flight_path_pixels = 0.0;
    for _ in 0..240 {
        let before = airborne.screen_position;
        airborne.advance(1.0 / 60.0, Behavior::Flight, origin, screen, false, None);
        flight_path_pixels += airborne.screen_position.distance(before);
    }
    let flight_horizontal_pixels = (airborne.screen_position.x - flight_start.x).abs();
    let flight_vertical_pixels = (airborne.screen_position.y - flight_start.y).abs();
"""
          new_motion = """    let flight_start = airborne.screen_position;
    let mut flight_path_pixels = 0.0;
    let mut flight_min_x = flight_start.x;
    let mut flight_max_x = flight_start.x;
    let mut flight_min_y = flight_start.y;
    let mut flight_max_y = flight_start.y;
    for _ in 0..240 {
        let before = airborne.screen_position;
        airborne.advance(1.0 / 60.0, Behavior::Flight, origin, screen, false, None);
        flight_path_pixels += airborne.screen_position.distance(before);
        flight_min_x = flight_min_x.min(airborne.screen_position.x);
        flight_max_x = flight_max_x.max(airborne.screen_position.x);
        flight_min_y = flight_min_y.min(airborne.screen_position.y);
        flight_max_y = flight_max_y.max(airborne.screen_position.y);
    }
    let flight_horizontal_pixels = flight_max_x - flight_min_x;
    let flight_vertical_pixels = flight_max_y - flight_min_y;
"""
          if pet.count(old_motion) != 1:
              raise SystemExit('flight coverage measurement marker was not unique')
          pet_path.write_text(
              pet.replace(old_motion, new_motion, 1),
              encoding='utf-8',
              newline='\n',
          )

          runtime_path = Path('crates/mechofly-app/src/runtime.rs')
          runtime = runtime_path.read_text(encoding='utf-8')
          old_runtime = "    pub fn stimulate_action(&mut self, action: Action) -> bool {\n"
          new_runtime = "    #[allow(dead_code)]\n    pub fn stimulate_action(&mut self, action: Action) -> bool {\n"
          if runtime.count(old_runtime) != 1:
              raise SystemExit('stimulate_action marker was not unique')
          runtime_path.write_text(
              runtime.replace(old_runtime, new_runtime, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY
          cargo fmt --all
          cargo test --workspace --locked
          git diff --check
      - name: Publish implementation candidate
        shell: bash
        run: |
          git config user.name "Yael Demedetskaya"
          git config user.email "31790191+yaelkroy@users.noreply.github.com"
          git rm -r tools/.screen-ecotope-patch
          git add \
            crates/mechofly-app/src/app.rs \
            crates/mechofly-app/src/brain_lab.rs \
            crates/mechofly-app/src/desktop_pet.rs \
            crates/mechofly-app/src/main.rs \
            crates/mechofly-app/src/pet.rs \
            crates/mechofly-app/src/runtime.rs \
            crates/mechofly-app/src/screen_ecotope.rs \
            crates/mechofly-app/src/self_test.rs \
            crates/mechofly-core/src/model.rs
          git commit -m "Implement Screen Ecotope work mode"
          git push origin HEAD:feat/screen-ecotope-work-mode-v1

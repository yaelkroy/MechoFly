name: Repair N2 staging verifier ancestry gate

on:
  push:
    branches: ["feat/behavior-transition-telemetry-rust-v9"]
    paths: [".github/workflows/fix-n2-staging-verifier.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Repair verifier and publish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-n2-transition-telemetry.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Verify exact N0 parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "c80d827a0d7eae9636bbf02c2916b5946f42319e"
          test "$(git show -s --format=%T HEAD^)" = "c4c59970af6dbe0449a02e916580dedf06efad1d"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
'''
          new = '''      - name: Verify exact N0 parent
        shell: bash
        run: |
          base="c80d827a0d7eae9636bbf02c2916b5946f42319e"
          test "$(git show -s --format=%T "$base")" = "c4c59970af6dbe0449a02e916580dedf06efad1d"
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base"..HEAD)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/apply-n2-transition-telemetry.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/fix-n2-staging-verifier.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
'''
          if text.count(old) != 1:
              raise SystemExit('expected one stale verifier block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git config user.name "Yael Demedetskaya"
          git config user.email "31790191+yaelkroy@users.noreply.github.com"
          git rm .github/workflows/fix-n2-staging-verifier.yml
          git add .github/workflows/apply-n2-transition-telemetry.yml
          git commit -m "Repair N2 staging verifier ancestry gate"
          git push origin HEAD:feat/behavior-transition-telemetry-rust-v9

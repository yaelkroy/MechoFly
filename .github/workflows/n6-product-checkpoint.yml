name: MechoFly N6 product-checkpoint foundation

on:
  push:
    branches: ["feat/n6-product-checkpoint-foundation-rust-v22"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n6-product-checkpoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: mechofly-n6-checkpoint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mechofly-n6-checkpoint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            mechofly-n41-exploratory-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Static boundaries and frozen identities
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed.' }
          python tools/verify_n41_integration.py --root . --receipt artifacts/n41-runtime-isolation.json
          if ($LASTEXITCODE -ne 0) { throw 'N4.1 runtime isolation failed.' }
          python tools/verify_n41_natural_motion.py --root . --receipt artifacts/n41-natural-motion.json
          if ($LASTEXITCODE -ne 0) { throw 'Accepted natural-motion boundary failed.' }
          python tools/verify_n41_natural_flight.py --root . --receipt artifacts/n41-natural-flight.json
          if ($LASTEXITCODE -ne 0) { throw 'Natural-flight boundary failed.' }
          python tools/verify_n41_exploratory_flight.py --root . --receipt artifacts/n41-exploratory-flight.json
          if ($LASTEXITCODE -ne 0) { throw 'Exploratory-flight boundary failed.' }
          python tools/verify_n6_product_checkpoint.py --root . --receipt artifacts/n6-static.json
          if ($LASTEXITCODE -ne 0) { throw 'N6 product-checkpoint boundary failed.' }
      - name: Canonical and feature Rust gates
        shell: pwsh
        run: |
          cargo test --release --locked --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Canonical workspace tests failed.' }
          cargo test --release --locked --workspace --all-targets --features mechofly-app/n6-product-checkpoint
          if ($LASTEXITCODE -ne 0) { throw 'N6 workspace tests failed.' }
          cargo clippy --release --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Canonical clippy failed.' }
          cargo clippy --release --locked --workspace --all-targets --features mechofly-app/n6-product-checkpoint -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'N6 clippy failed.' }
      - name: Canonical rejection and deterministic feature receipt
        shell: pwsh
        run: |
          $env:MECHOFLY_DATA_DIR = (Join-Path $PWD 'artifacts\canonical-data')
          cargo build --release --locked -p mechofly-app
          if ($LASTEXITCODE -ne 0) { throw 'Canonical build failed.' }
          $canonical = (Resolve-Path 'target\release\MechoFly.exe').Path
          $rejectReceipt = (Join-Path $PWD 'artifacts\canonical-must-reject-n6.json')
          $process = Start-Process -FilePath $canonical -ArgumentList @('--n6-product-checkpoint-self-test', ('"' + $rejectReceipt + '"')) -Wait -PassThru
          if ($process.ExitCode -eq 0 -or (Test-Path -LiteralPath $rejectReceipt)) {
            throw 'Canonical binary accepted the N6 self-test.'
          }

          $candidateTarget = (Join-Path $PWD 'artifacts\candidate-target')
          cargo build --release --locked -p mechofly-app --features n6-product-checkpoint --target-dir $candidateTarget
          if ($LASTEXITCODE -ne 0) { throw 'Feature-gated N6 build failed.' }
          $candidate = (Resolve-Path (Join-Path $candidateTarget 'release\MechoFly.exe')).Path
          $receiptA = (Join-Path $PWD 'artifacts\n6-product-checkpoint-a.json')
          $receiptB = (Join-Path $PWD 'artifacts\n6-product-checkpoint-b.json')
          foreach ($receipt in @($receiptA, $receiptB)) {
            $process = Start-Process -FilePath $candidate -ArgumentList @('--n6-product-checkpoint-self-test', ('"' + $receipt + '"')) -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'N6 candidate self-test failed.' }
          }
          if ((Get-FileHash -LiteralPath $receiptA -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $receiptB -Algorithm SHA256).Hash) {
            throw 'N6 self-test receipts were not deterministic.'
          }
          $receipt = Get-Content -LiteralPath $receiptA -Raw | ConvertFrom-Json
          if ($receipt.status -ne 'PASS' -or
              -not $receipt.serialization_round_trip_exact -or
              -not $receipt.zero_intervention_branches_identical -or
              -not $receipt.changed_input_branch_diverged -or
              -not $receipt.live_state_digest_unchanged -or
              $receipt.live_restore_authorized -or
              $receipt.appdata_write_authorized -or
              $receipt.deployment_authorized) {
            throw 'N6 self-test receipt did not preserve the fail-closed contract.'
          }
      - name: Final source immutability
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting drifted.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Validation mutated tracked source.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mechofly-n6-product-checkpoint-foundation
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

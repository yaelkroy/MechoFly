name: Repair N2 staging verifier with valid workflow

on:
  push:
    branches: ["feat/behavior-transition-telemetry-rust-v9"]
    paths: [".github/workflows/fix-n2-staging-verifier-v2.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Repair verifier and publish
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path(".github/workflows/apply-n2-transition-telemetry.yml"); s=p.read_text(encoding="utf-8"); old=base64.b64decode("").decode(); new=base64.b64decode("").decode(); assert s.count(old)==1, "expected one stale verifier block"; p.write_text(s.replace(old,new,1), encoding="utf-8", newline="\n")'
          git config user.name "Yael Demedetskaya"
          git config user.email "31790191+yaelkroy@users.noreply.github.com"
          git rm .github/workflows/fix-n2-staging-verifier.yml .github/workflows/fix-n2-staging-verifier-v2.yml
          git add .github/workflows/apply-n2-transition-telemetry.yml
          git commit -m "Repair N2 staging verifier with valid workflow"
          git push origin HEAD:feat/behavior-transition-telemetry-rust-v9

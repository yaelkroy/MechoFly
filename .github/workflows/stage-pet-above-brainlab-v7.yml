name: Stage desktop-pet z-order repair

on:
  push:
    branches: ["fix/pet-above-brainlab-rust-v7"]
    paths: [".github/workflows/stage-pet-above-brainlab-v7.yml"]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply exact z-order repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/mechofly-app/src/desktop_pet.rs")
          text = path.read_text(encoding="utf-8").replace("\r\n", "\n")

          old_import = (
              "            HTTRANSPARENT, HWND_NOTOPMOST, HWND_TOPMOST, RegisterClassExW, "
              "SM_CXVIRTUALSCREEN,\n"
          )
          new_import = (
              "            HTTRANSPARENT, HWND_TOPMOST, RegisterClassExW, "
              "SM_CXVIRTUALSCREEN,\n"
          )
          if text.count(old_import) != 1:
              raise SystemExit("desktop_pet.rs: expected one HWND_NOTOPMOST import")
          text = text.replace(old_import, new_import, 1)

          pattern = re.compile(
              r"    pub fn set_observatory_open\(&mut self, open: bool\) \{\n"
              r".*?\n"
              r"    \}\n\n"
              r"    fn register_hotkeys",
              re.S,
          )
          replacement = '''    pub fn set_observatory_open(&mut self, open: bool) {
              if self.observatory_open == open {
                  return;
              }
              // Live Brain and Brain Lab are diagnostic surfaces; they must not
              // cover the desktop organism. Alpha holes remain click-through.
              unsafe {
                  SetWindowPos(
                      self.hwnd,
                      HWND_TOPMOST,
                      0,
                      0,
                      0,
                      0,
                      SWP_NOMOVE | SWP_NOSIZE | SWP_NOACTIVATE,
                  );
              }
              self.observatory_open = open;
          }

          fn register_hotkeys'''
          updated, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit(
                  f"desktop_pet.rs: expected one observatory method, found {count}"
              )
          path.write_text(updated, encoding="utf-8", newline="\n")
          PY
      - name: Format and test source patch
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          cargo test --workspace --locked
      - name: Publish source patch
        shell: bash
        run: |
          git config user.name "Yael Demedetskaya"
          git config user.email "31790191+yaelkroy@users.noreply.github.com"
          git add crates/mechofly-app/src/desktop_pet.rs
          git commit -m "Keep desktop pet above neural windows"
          git push origin HEAD:fix/pet-above-brainlab-rust-v7

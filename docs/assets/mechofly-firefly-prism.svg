<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="520" viewBox="0 0 1520 520" role="img" aria-labelledby="title desc">
  <title id="title">MechoFly Firefly Prism</title>
  <desc id="desc">An original stylized firefly-like companion with dark green elytra, amber pronotum, translucent flight wings, and a luminous chartreuse lantern.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#173126"/>
      <stop offset="0.55" stop-color="#091713"/>
      <stop offset="1" stop-color="#030908"/>
    </radialGradient>
    <radialGradient id="lanternHalo">
      <stop offset="0" stop-color="#e7ff77" stop-opacity=".92"/>
      <stop offset=".28" stop-color="#a8f05e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5edb49" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="elytron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc279"/>
      <stop offset=".35" stop-color="#164f3e"/>
      <stop offset="1" stop-color="#061a19"/>
    </linearGradient>
    <linearGradient id="pronotum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd15c"/>
      <stop offset=".45" stop-color="#ed8535"/>
      <stop offset="1" stop-color="#7e2828"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff8c7" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#79dfe8" stop-opacity=".54"/>
      <stop offset="1" stop-color="#d2f3a2" stop-opacity=".12"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1520" height="520" rx="42" fill="url(#bg)"/>
  <g transform="translate(520 260)">
    <ellipse cx="122" cy="0" rx="128" ry="108" fill="url(#lanternHalo)" filter="url(#glow)"/>
    <path d="M-15,-18 C30,-110 118,-154 205,-120 C150,-75 100,-38 35,-4 Z" fill="url(#wing)" stroke="#86e5c0" stroke-opacity=".72" stroke-width="3"/>
    <path d="M-15,18 C30,110 118,154 205,120 C150,75 100,38 35,4 Z" fill="url(#wing)" stroke="#86e5c0" stroke-opacity=".72" stroke-width="3"/>
    <path d="M-12,-5 C30,-62 133,-67 205,-31 C184,-7 96,2 -12,3 Z" fill="url(#elytron)" stroke="#7adc83" stroke-width="4"/>
    <path d="M-12,5 C30,62 133,67 205,31 C184,7 96,-2 -12,-3 Z" fill="url(#elytron)" stroke="#7adc83" stroke-width="4"/>
    <ellipse cx="-45" cy="0" rx="58" ry="55" fill="url(#pronotum)" stroke="#ffe073" stroke-width="4"/>
    <ellipse cx="-44" cy="0" rx="20" ry="19" fill="#10251e"/>
    <ellipse cx="-105" cy="0" rx="37" ry="33" fill="#071412" stroke="#527b5c" stroke-width="3"/>
    <ellipse cx="-118" cy="-18" rx="10" ry="8" fill="#e66b3c"/>
    <ellipse cx="-118" cy="18" rx="10" ry="8" fill="#e66b3c"/>
    <path d="M178,-24 C224,-16 248,-8 262,0 C248,8 224,16 178,24 Z" fill="#c9f56f" stroke="#edff9a" stroke-width="3"/>
    <g fill="none" stroke="#253d2f" stroke-width="8" stroke-linecap="round">
      <path d="M-58,-30 L-104,-72 L-145,-80"/>
      <path d="M-10,-40 L-35,-93 L-62,-116"/>
      <path d="M48,-35 L80,-88 L122,-105"/>
      <path d="M-58,30 L-104,72 L-145,80"/>
      <path d="M-10,40 L-35,93 L-62,116"/>
      <path d="M48,35 L80,88 L122,105"/>
    </g>
    <g fill="none" stroke="#63856a" stroke-width="3" stroke-linecap="round">
      <path d="M-126,-12 C-174,-38 -193,-57 -212,-78"/>
      <path d="M-126,12 C-174,38 -193,57 -212,78"/>
    </g>
  </g>
  <text x="830" y="226" fill="#f5ffe7" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700">MechoFly</text>
  <text x="834" y="292" fill="#cfff73" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="600" letter-spacing="4">FIREFLY PRISM</text>
  <text x="836" y="342" fill="#a9c4b2" font-family="Segoe UI, Arial, sans-serif" font-size="23">Two procedural skins · Drosophila default</text>
  <text x="836" y="378" fill="#82a28d" font-family="Segoe UI, Arial, sans-serif" font-size="21">Drosophila default · Firefly optional on AI100</text>
</svg>

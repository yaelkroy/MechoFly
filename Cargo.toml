[workspace]
members = [
    "crates/mechofly-app",
    "crates/mechofly-core",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/yaelkroy/MechoFly"

[workspace.dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
csv = "1.4.0"
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
env_logger = "0.11.8"
flate2 = "1.1.5"
log = "0.4.29"
pollster = "0.4.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
tray-icon = "0.24.2"
wgpu = { version = "30.0.0", default-features = false, features = [
    "dx12",
    "metal",
    "std",
    "vulkan",
    "wgsl",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
